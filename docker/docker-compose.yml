name: codemind

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: codemind-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + dashboard http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # 4GB-VRAM / 16GB-RAM box: keep Qdrant's own footprint small
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: 2
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB: 20000
    deploy:
      resources:
        limits:
          memory: 1500m

  # Optional. Only if you outgrow SQLite: `docker compose --profile pg up`
  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: codemind
      POSTGRES_DB: codemind
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  qdrant_storage:
  pg_data:
